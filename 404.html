<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | AOKI YUWA</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0f;
      color: #e8e4d9;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      gap: 1.5rem;
    }
    .code  { font-size: 5rem; font-weight: 700; color: #4af0c0; line-height: 1; }
    .msg   { font-size: 0.9rem; color: #6b6b7a; letter-spacing: 0.1em; }
    .back  {
      margin-top: 1rem;
      padding: 0.6rem 1.6rem;
      border: 1px solid #4af0c0;
      border-radius: 4px;
      color: #4af0c0;
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .back:hover { background: #4af0c0; color: #0a0a0f; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <p class="msg">PAGE NOT FOUND</p>
  <a class="back" href="/portfolio/">← BACK TO PORTFOLIO</a>
  <script>
    // 3秒後に自動リダイレクト
    setTimeout(() => location.replace('/portfolio/'), 3000);
  </script>
</body>
</html>
